<!doctype html><meta charset="utf-8"><title>normprobe</title>
<script type="module">
import * as THREE from 'three';
import { WebGPURenderer } from 'three/webgpu';

const renderer = new WebGPURenderer({ antialias: false });
await renderer.init();
renderer.setSize(64, 64);
document.body.appendChild(renderer.domElement);
const camera = new THREE.PerspectiveCamera(70, 1, 0.1, 100);
camera.position.z = 5;

// Geometry deliberately WITHOUT a 'normal' attribute, like a chunk mesh.
function bareGeo() {
  const g = new THREE.BufferGeometry();
  g.setAttribute('position', new THREE.BufferAttribute(new Float32Array([
    -1,-1,0, 1,-1,0, 0,1,0,
  ]), 3));
  g.setAttribute('uv', new THREE.BufferAttribute(new Float32Array([0,0, 1,0, 0.5,1]), 2));
  g.setAttribute('color', new THREE.BufferAttribute(new Float32Array([1,1,1, 1,1,1, 1,1,1]), 3));
  g.setIndex([0,1,2]);
  return g;
}

const VARIANTS = {
  plain:        {},
  doubleSide:   { side: THREE.DoubleSide },
  fog:          { fog: true },
  alphaTest:    { alphaTest: 0.5 },
  vertexColors: { vertexColors: true },
};

async function runCase(label, { hemi, dir, noLightsFlag }) {
  const scene = new THREE.Scene();
  if (hemi) scene.add(new THREE.HemisphereLight(0xcfe4f5, 0x4a3a28, 1.5));
  if (dir)  scene.add(new THREE.DirectionalLight(0xffe0b0, 1.35));
  scene.fog = new THREE.Fog(0x1f3241, 40, 260);
  let x = -2;
  for (const [name, params] of Object.entries(VARIANTS)) {
    const m = new THREE.MeshBasicMaterial({ ...params, name: label + '-' + name });
    // Unique colour so each material is a distinct object => distinct build.
    m.color.setHex(Math.floor(Math.random() * 0xffffff));
    if (noLightsFlag) m.lights = false;
    const mesh = new THREE.Mesh(bareGeo(), m);
    mesh.position.x = x; x += 1;
    scene.add(mesh);
  }
  console.log('@@BEGIN ' + label);
  await renderer.renderAsync(scene, camera);
  console.log('@@END ' + label);
}

await runCase('A_no_hemi_dir_only',   { hemi: false, dir: true  });
await runCase('B_with_hemi',          { hemi: true,  dir: true  });
await runCase('C_with_hemi_lightsOff',{ hemi: true,  dir: true, noLightsFlag: true });
console.log('@@DONE');
</script>
