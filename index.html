<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>Philosoraptors — The Golden Seed</title>
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Ccircle cx='16' cy='16' r='11' fill='%23ff9a2e'/%3E%3Ccircle cx='16' cy='16' r='5' fill='%23ffe9b0'/%3E%3C/svg%3E" />
    <style>
      :root {
        --ember: #ff9a2e;
        --flame: #ffb347;
        --core: #ffe9b0;
        --cold: #59819c;
        --ink: #0d1016;
        --panel: rgba(16, 12, 10, 0.72);
        --edge: rgba(255, 200, 130, 0.22);
        --text: #e9d6b6;
        --dim: #a08965;
        font-family: ui-monospace, "SF Mono", Menlo, Consolas, monospace;
      }
      * { box-sizing: border-box; }
      html, body {
        margin: 0; height: 100%; overflow: hidden;
        background: var(--ink); color: var(--text);
        -webkit-font-smoothing: antialiased;
      }
      canvas { display: block; }

      #hud { position: fixed; inset: 0; pointer-events: none; z-index: 10; }

      /* ---- crosshair */
      #cross {
        position: absolute; left: 50%; top: 50%;
        width: 18px; height: 18px; margin: -9px 0 0 -9px;
        opacity: 0.75;
      }
      #cross::before, #cross::after {
        content: ''; position: absolute; background: var(--core);
        box-shadow: 0 0 6px rgba(255, 154, 46, 0.9);
      }
      #cross::before { left: 8px; top: 0; width: 2px; height: 18px; }
      #cross::after { top: 8px; left: 0; height: 2px; width: 18px; }

      .panel {
        background: var(--panel);
        border: 1px solid var(--edge);
        border-radius: 10px;
        backdrop-filter: blur(9px);
        padding: 10px 12px;
      }

      /* ---- top left: coherence */
      #status { position: absolute; left: 16px; top: 16px; width: 268px; }
      .bar { height: 9px; border-radius: 5px; background: rgba(255,255,255,.10); overflow: hidden; margin: 5px 0 2px; }
      .bar > i { display: block; height: 100%; border-radius: 5px; transition: width .25s ease; }
      #cohFill { background: linear-gradient(90deg, var(--cold), var(--ember), var(--core)); }
      #spkFill { background: linear-gradient(90deg, #2f6f8f, #6fd8ff, var(--core));
                 box-shadow: 0 0 10px rgba(111,216,255,.6); }
      #beamHint { position: absolute; left: 50%; top: calc(50% + 34px);
                  transform: translateX(-50%); font-size: 12px; letter-spacing: .06em;
                  color: var(--core); text-shadow: 0 2px 10px #000, 0 0 18px rgba(255,154,46,.6);
                  opacity: 0; transition: opacity .18s ease; white-space: nowrap; }
      #objective { position: absolute; left: 50%; top: 18px; transform: translateX(-50%);
                   text-align: center; max-width: 620px; pointer-events: none; }
      #objMain { font-size: 15px; color: var(--core); letter-spacing: .03em;
                 text-shadow: 0 2px 14px #000, 0 0 26px rgba(255,154,46,.5); }
      #objSub { font-size: 11px; color: var(--ember); margin-top: 4px;
                text-shadow: 0 2px 10px #000; }
      .spell u { display: block; text-decoration: none; font-size: 8.5px;
                 color: var(--text); opacity: .78; margin-top: 2px; line-height: 1.25; }
      #molFill { background: linear-gradient(90deg, #4a4a4a, #7d4a4a, #b03a3a); }
      #blindFill { background: linear-gradient(90deg, #2a3550, #55618a); }
      .row { display: flex; justify-content: space-between; align-items: baseline; font-size: 11px; }
      .k { color: var(--dim); letter-spacing: .08em; text-transform: uppercase; font-size: 9.5px; }
      .v { color: var(--core); font-variant-numeric: tabular-nums; }
      .sub { font-size: 10.5px; color: var(--dim); margin-top: 3px; line-height: 1.45; }

      /* ---- self sigil */
      #me { display: flex; gap: 10px; align-items: center; margin-bottom: 8px; }
      #meSigil { width: 34px; height: 34px; border-radius: 7px; border: 1px solid var(--edge); background: #0a0c10; }
      #meName { font-size: 13px; color: var(--core); letter-spacing: .04em; }
      #meStage { font-size: 10px; color: var(--dim); }

      /* ---- top right: chapter */
      #chapter { position: absolute; right: 16px; top: 16px; width: 320px; }
      #chTitle { font-size: 14px; color: var(--core); }
      #chSub { font-size: 10px; color: var(--ember); letter-spacing: .1em; text-transform: uppercase; margin-top: 1px; }
      #chObj { font-size: 11.5px; margin-top: 8px; line-height: 1.5; }
      #chEpi { font-size: 10.5px; color: var(--dim); font-style: italic; margin-top: 8px; line-height: 1.5;
               border-left: 2px solid var(--edge); padding-left: 8px; }

      /* ---- seals */
      #seals { position: absolute; right: 16px; top: 50%; transform: translateY(-50%); width: 250px;
               display: flex; flex-direction: column; gap: 8px; }
      .seal { font-size: 11px; }
      .sealHead { display: flex; justify-content: space-between; color: var(--core); }
      .marks { display: flex; gap: 4px; margin-top: 6px; flex-wrap: wrap; }
      .mark { width: 20px; height: 20px; border-radius: 4px; background: #0a0c10; border: 1px solid var(--edge); }
      .slot { width: 20px; height: 20px; border-radius: 4px; border: 1px dashed rgba(255,200,130,.28); }
      .ttl { color: var(--dim); font-variant-numeric: tabular-nums; }

      /* ---- spellbook */
      #spells { position: absolute; left: 50%; bottom: 92px; transform: translateX(-50%);
                display: flex; gap: 6px; }
      .spell { width: 60px; padding: 7px 4px; text-align: center; font-size: 9.5px;
               background: var(--panel); border: 1px solid var(--edge); border-radius: 8px;
               color: var(--dim); line-height: 1.3; }
      .spell.on { border-color: var(--ember); color: var(--core); box-shadow: 0 0 14px rgba(255,154,46,.28); }
      .spell.locked { opacity: .35; }
      .spell b { display: block; font-size: 13px; color: var(--core); margin-bottom: 2px; }
      .spell.locked b { color: var(--dim); }
      .spell i { display: block; font-style: normal; font-size: 8.5px; color: var(--ember); margin-top: 2px; }

      /* ---- hotbar */
      #hotbar { position: absolute; left: 50%; bottom: 20px; transform: translateX(-50%);
                display: flex; gap: 5px; }
      .slotB { width: 54px; height: 54px; background: var(--panel); border: 1px solid var(--edge);
               border-radius: 8px; position: relative; overflow: hidden; }
      .slotB.on { border-color: var(--ember); box-shadow: 0 0 16px rgba(255,154,46,.35); }
      .slotB canvas { width: 100%; height: 100%; image-rendering: pixelated; }
      .toolGlyph { width: 100%; height: 100%; display: grid; place-items: center;
                   font-size: 26px; line-height: 1; }
      .toolGlyph.claws { color: #d8c9a8; text-shadow: 0 0 10px rgba(255,233,176,.5); }
      .toolGlyph.stream { color: #6fd8ff; text-shadow: 0 0 14px rgba(111,216,255,.8); }
      .slotB span { position: absolute; left: 3px; top: 2px; font-size: 9px; color: var(--core);
                    text-shadow: 0 1px 3px #000; }
      .slotB em { position: absolute; right: 3px; bottom: 2px; font-size: 9px; font-style: normal;
                  color: var(--core); text-shadow: 0 1px 3px #000; }

      /* ---- log */
      #log { position: absolute; left: 16px; bottom: 20px; width: 320px;
             display: flex; flex-direction: column-reverse; gap: 4px; }
      .line { font-size: 11px; padding: 5px 9px; background: var(--panel);
              border-left: 2px solid var(--ember); border-radius: 0 6px 6px 0;
              animation: fade 9s forwards; }
      @keyframes fade { 0%,80% { opacity: 1 } 100% { opacity: 0 } }

      /* ---- centre banner */
      #banner { position: absolute; left: 50%; top: 34%; transform: translate(-50%,-50%);
                text-align: center; opacity: 0; transition: opacity .6s ease; max-width: 620px; }
      #banner.show { opacity: 1; }
      #bTitle { font-size: 30px; letter-spacing: .06em; color: var(--core);
                text-shadow: 0 0 28px rgba(255,154,46,.55); }
      #bSub { font-size: 12px; color: var(--ember); letter-spacing: .22em;
              text-transform: uppercase; margin-top: 8px; }
      #bBody { font-size: 13px; color: var(--text); margin-top: 14px; font-style: italic; line-height: 1.6; }

      /* ---- players */
      #roster { position: absolute; left: 16px; top: 230px; width: 268px; }
      .peer { display: flex; align-items: center; gap: 8px; font-size: 11px; margin-top: 6px; }
      .peer canvas { width: 20px; height: 20px; border-radius: 4px; background: #0a0c10; }
      .peer .d { margin-left: auto; color: var(--dim); font-variant-numeric: tabular-nums; }

      /* ---- title screen */
      #gate { position: fixed; inset: 0; z-index: 50;
              background: radial-gradient(ellipse at 50% 35%, #1a1410 0%, #06080c 72%);
              overflow-y: auto; overscroll-behavior: contain; padding: 40px 20px 60px; }
      #gate.hidden { display: none; }
      #gate::-webkit-scrollbar { width: 10px; }
      #gate::-webkit-scrollbar-thumb { background: rgba(255,200,130,.28); border-radius: 5px; }

      .tScreen { max-width: 560px; margin: 0 auto; text-align: center;
                 pointer-events: auto; position: relative; }
      .tTitle { font-size: 44px; margin: 12px 0 0; letter-spacing: .07em; font-weight: 600;
                color: var(--core); text-shadow: 0 0 46px rgba(255,154,46,.45); }
      .tSub { font-size: 10.5px; letter-spacing: .34em; text-transform: uppercase;
              color: var(--ember); margin-top: 10px; }
      .tWorldTag { margin-top: 14px; font-size: 12px; color: var(--dim); }
      .tWorldTag b { color: var(--core); letter-spacing: .2em; }
      .tBlurb { font-size: 13px; line-height: 1.75; color: var(--text);
                margin: 22px auto 0; max-width: 460px; }
      .tHead { font-size: 22px; color: var(--core); margin: 4px 0 22px; letter-spacing: .04em; font-weight: 500; }

      .tMenu { display: flex; flex-direction: column; gap: 9px; margin: 28px auto 0; max-width: 340px; }
      .tBig, .tBtn {
        pointer-events: auto; cursor: pointer; font: inherit; width: 100%;
        border-radius: 10px; padding: 13px 18px; letter-spacing: .1em; }
      .tBig { background: linear-gradient(180deg, var(--flame), var(--ember));
              color: #241202; border: 0; font-size: 14px; text-transform: uppercase;
              box-shadow: 0 8px 30px rgba(255,154,46,.32); }
      .tBig:hover { filter: brightness(1.08); }
      .tBtn { background: rgba(16,12,10,.6); border: 1px solid var(--edge);
              color: var(--text); font-size: 12.5px; }
      .tBtn:hover { border-color: var(--ember); color: var(--core); }
      .tBack { position: absolute; left: 0; top: 0; pointer-events: auto; cursor: pointer;
               background: transparent; border: 0; color: var(--dim); font: inherit;
               font-size: 12px; padding: 4px 6px; }
      .tBack:hover { color: var(--core); }
      .tFoot { font-size: 11.5px; color: var(--dim); line-height: 1.6; margin-top: 26px; }
      .tFoot code { background: #0a0c10; border: 1px solid var(--edge); border-radius: 4px;
                    padding: 1px 5px; color: var(--core); font-size: 11px; }

      .tForm { display: flex; flex-direction: column; gap: 16px; text-align: left;
               max-width: 400px; margin: 0 auto; }
      .tForm label { font-size: 12.5px; color: var(--core); display: flex; flex-direction: column; gap: 5px; }
      .tForm label em { font-style: normal; font-size: 10.5px; color: var(--dim); }
      .tForm input[type=text], .tForm input:not([type]) {
        pointer-events: auto; background: #0a0c10; border: 1px solid var(--edge);
        border-radius: 8px; color: var(--core); font: inherit; font-size: 13px; padding: 9px 12px; }
      .tForm input:focus { outline: 0; border-color: var(--ember); }
      .tCheck { flex-direction: row !important; align-items: flex-start; gap: 10px !important;
                cursor: pointer; pointer-events: auto; }
      .tCheck input { pointer-events: auto; accent-color: var(--ember); margin-top: 2px; }
      .tCheck span { display: flex; flex-direction: column; gap: 3px; }

      .tJoinRow { display: flex; gap: 8px; max-width: 400px; margin: 0 auto 26px; }
      .tJoinRow input { flex: 1 1 auto; pointer-events: auto; background: #0a0c10;
                        border: 1px solid var(--edge); border-radius: 8px; color: var(--core);
                        font: inherit; font-size: 15px; padding: 10px 14px;
                        text-transform: uppercase; letter-spacing: .2em; text-align: center; }
      .tJoinRow input:focus { outline: 0; border-color: var(--ember); }
      .tJoinRow .tBtn { width: auto; padding: 10px 20px; }

      .tListHead { display: flex; align-items: center; gap: 10px; max-width: 400px;
                   margin: 0 auto 10px; font-size: 10px; letter-spacing: .22em;
                   text-transform: uppercase; color: var(--ember); }
      .tListHead span { flex: 1 1 auto; text-align: left; }
      .tMini { pointer-events: auto; cursor: pointer; background: transparent;
               border: 1px solid var(--edge); border-radius: 6px; color: var(--dim);
               font: inherit; font-size: 9.5px; padding: 3px 9px; letter-spacing: .1em; }
      .tMini:hover { color: var(--core); border-color: var(--ember); }
      .tList { max-width: 400px; margin: 0 auto; display: flex; flex-direction: column; gap: 6px; }
      .tWorld { pointer-events: auto; cursor: pointer; display: grid;
                grid-template-columns: 1fr auto; gap: 2px 12px; text-align: left;
                background: #0a0c10; border: 1px solid var(--edge); border-radius: 9px;
                padding: 11px 14px; font: inherit; color: var(--text); }
      .tWorld:hover { border-color: var(--ember); }
      .tWorld.busy { border-color: rgba(255,154,46,.5); }
      .tWorld .wName { color: var(--core); font-size: 13.5px; }
      .tWorld .wCode { color: var(--ember); font-size: 12px; letter-spacing: .16em; }
      .tWorld .wMeta { grid-column: 1 / -1; color: var(--dim); font-size: 10.5px; }

      #resume { position: fixed; left: 50%; top: 50%; transform: translate(-50%,-50%);
                z-index: 40; padding: 12px 22px; border-radius: 10px;
                background: var(--panel); border: 1px solid var(--ember);
                color: var(--core); font-size: 13px; letter-spacing: .1em;
                text-transform: uppercase; opacity: 0; pointer-events: none;
                transition: opacity .25s ease; }
      #resume.show { opacity: 1; }
      #vig { position: fixed; inset: 0; pointer-events: none; z-index: 9;
             box-shadow: inset 0 0 200px 40px rgba(6,10,20,0); transition: box-shadow .6s ease; }
    </style>
  </head>
  <body>
    <div id="vig"></div>
    <div id="hud"></div>
    <div id="resume">click to resume</div>
    <div id="gate"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
